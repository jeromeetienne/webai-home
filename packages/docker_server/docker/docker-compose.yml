# Run from the repository root: docker compose -f packages/docker_server/docker/docker-compose.yml --project-directory . up --build
# See packages/docker_server/README.md for what each environment variable configures.
#
# Every relative path below is written relative to the repository root, not to this file's own
# directory, because Compose resolves relative paths against the project directory. That is why
# each command that uses this file passes `--project-directory` pointing at the repository root.
# Deployment platforms that build from a checkout of this repository (Coolify, for one) already
# pass the repository root as the project directory, so they need no extra configuration.
services:
  webai-at-home:
    build:
      context: .
      dockerfile: packages/docker_server/docker/Dockerfile
    ports:
      - "8787:8787"
      - "8788:8788"
      - "8789:8789"
    environment:
      GATEWAY_PORT: "8787"
      GATEWAY_AUTH_TOKEN: "development-token"
      GATEWAY_STATE_FILE: "/data/gateway-state.json"
      CONSUMER_OPENAI_PORT: "8788"
      GATEWAY_WS_URL: "ws://127.0.0.1:8787"
      CONSUMER_OPENAI_AUTH_TOKEN: "development-token"
      CONSUMER_OPENAI_NAME: "consumer_openai server"
      WORKER_PORT: "8789"
      # CONSUMER_OPENAI_API_KEY: "set-a-key-to-require-callers-to-present-it"
    volumes:
      - webai-at-home-data:/data
volumes:
  webai-at-home-data:
