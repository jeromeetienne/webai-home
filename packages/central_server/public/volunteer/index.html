<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebAI Volunteer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/volunteer/css/main.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="/">WebAI Volunteer</a></div></nav>
    <main class="container pb-5"><div class="row justify-content-center"><div class="col-lg-9">
        <div class="card shadow-sm"><div class="card-body p-4"><h1 class="card-title h2">Volunteer browser tab</h1><p class="text-secondary">Connect this browser tab to make it available for WebAI tasks.</p><div class="row g-3 align-items-end"><div class="col-md-8"><label class="form-label" for="name">Volunteer name</label><input class="form-control" id="name" value="browser-volunteer"></div><div class="col-md-4"><button class="btn btn-primary w-100" id="connect" type="button">Connect</button></div></div></div></div>
        <div class="card shadow-sm mt-4"><div class="card-header d-flex justify-content-between align-items-center"><span>Connection messages</span><span class="badge text-bg-secondary" id="status">Not connected</span></div><div class="card-body"><pre class="bg-dark text-light rounded p-3 mb-0" id="log">No messages yet.</pre></div></div>
    </div></div></main>
    <script type="module" src="/volunteer/src/main.ts"></script>
</body>
</html>
