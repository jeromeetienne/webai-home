<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
<title>webai-at-home logo</title>
<desc>Light-background version of the globe and neural network mark.</desc>
<style>
.bg { fill:#f4f2ff; }
.globe { fill:none; stroke:#8f7cf0; stroke-width:3; opacity:0.6; }
.edge { stroke:#4c3bcf; stroke-width:2.5; }
.edge-dim { stroke:#8f7cf0; stroke-width:2; opacity:0.6; }
.node { fill:#4c3bcf; }
.node-lit { fill:#2a1f80; }
.node-ring { fill:none; stroke:#4c3bcf; stroke-width:2.5; opacity:0.6; }
</style>

<rect x="60" y="60" width="560" height="560" rx="120" class="bg"/>

<circle cx="340" cy="340" r="230" class="globe"/>
