<circle cx="340" cy="200" r="13" class="node-lit"/>

<circle cx="230" cy="130" r="9" class="node"/>
<circle cx="520" cy="170" r="9" class="node"/>
<circle cx="380" cy="150" r="9" class="node"/>
<circle cx="150" cy="470" r="9" class="node"/>
