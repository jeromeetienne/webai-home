<ellipse cx="340" cy="340" rx="230" ry="180" class="globe"/>
<line x1="110" y1="340" x2="570" y2="340" class="globe"/>
<line x1="340" y1="110" x2="340" y2="570" class="globe"/>
<line x1="167" y1="200" x2="513" y2="480" class="globe"/>
<line x1="167" y1="480" x2="513" y2="200" class="globe"/>

<g>
<line x1="340" y1="340" x2="230" y2="230" class="edge"/>
<line x1="340" y1="340" x2="450" y2="240" class="edge"/>
<line x1="340" y1="340" x2="220" y2="420" class="edge"/>
