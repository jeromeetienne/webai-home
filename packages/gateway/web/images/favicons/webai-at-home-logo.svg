<line x1="340" y1="340" x2="340" y2="200" class="edge"/>
<line x1="230" y1="230" x2="230" y2="130" class="edge-dim"/>
<line x1="450" y1="240" x2="520" y2="170" class="edge-dim"/>
<line x1="450" y1="240" x2="380" y2="150" class="edge-dim"/>
<line x1="220" y1="420" x2="150" y2="470" class="edge-dim"/>
<line x1="220" y1="420" x2="190" y2="530" class="edge-dim"/>
<line x1="460" y1="440" x2="530" y2="500" class="edge-dim"/>
<line x1="460" y1="440" x2="420" y2="540" class="edge-dim"/>
<line x1="340" y1="200" x2="270" y2="130" class="edge-dim"/>
</g>

<circle cx="340" cy="340" r="18" class="node-lit"/>
<circle cx="340" cy="340" r="28" class="node-ring"/>

<circle cx="230" cy="230" r="13" class="node-lit"/>
