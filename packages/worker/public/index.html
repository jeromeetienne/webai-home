<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebAI Worker</title>
    <link rel="icon" href="/images/favicons/webai-at-home-logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">WebAI@Home / <span class="text-white-50">Worker</span></a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-5">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h2 class="h5 mb-0">Connect this browser</h2>
                            <span class="badge rounded-pill text-bg-secondary" id="status">Not connected</span>
                        </div>
                        <p class="text-secondary">Give this browser a name, then connect it so WebAI can assign stages to the browser.</p>
                        <label class="form-label" for="name">Worker name</label>
                        <input class="form-control mb-3" id="name" value="browser-worker">
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="connect" type="button">Connect worker</button>
                            <button class="btn btn-outline-danger d-none" id="disconnect" type="button">Disconnect</button>
                        </div>
                        <hr>
                        <dl class="row small mb-0">
                            <dt class="col-sm-4 text-secondary">Worker</dt><dd class="col-sm-8" id="worker-name">Not connected</dd>
                            <dt class="col-sm-4 text-secondary">Device ID</dt><dd class="col-sm-8 text-break" id="device-id">Not assigned</dd>
                            <dt class="col-sm-4 text-secondary">Stages</dt><dd class="col-sm-8"><div class="d-flex flex-wrap gap-1" id="stages"></div></dd>
                        </dl>
                    </div>
                </section>
            </div>
            <div class="col-lg-7">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h2 class="h5 mb-0">Recent events</h2>
                    </div>
                    <div class="card-body px-4">
                        <div class="event-list" id="events"></div>
                    </div>
                </section>
            </div>
        </div>

    </main>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
